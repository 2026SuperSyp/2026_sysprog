; 보스전 수치. 없는 줄은 boss/boss.c의 기본값을 쓴다. 거리는 칸, 시간은 틱(1틱 = 50ms)
ticks = 3600               ; 판의 길이(180초)
fly_hp_per_player = 80     ; 초파리 체력 = 이것 x 참가자 수
fly_radius = 0.6
player_radius = 0.25
step = 0.5                 ; 한 걸음(칸)
slow_step = 0.1            ; 살금살금 한 걸음(C로 켜 두었거나 Shift를 누른 채 이동)
step_ticks = 3             ; 한 걸음에 걸리는 틱 수. 이 틱 수에 나눠 움직이고, 키를 누르고 있어도 이보다 빨리 걷지 못한다

; 초파리의 몸. 실제 초파리에서 잰 값이다(출처는 docs/brain-notes.md). 뇌의 반응(0~1)에 곱한다
body_mm = 2.5              ; 몸길이. 게임에서는 지름(fly_radius x 2)이 몸길이다
walk_mm_s = 7.2            ; 앞으로 걷기(느린 걸음)
run_mm_s = 44.7            ; 달아나기(가장 빠른 걸음)
back_mm_s = 7.2            ; 뒤로 걷기(잰 값을 찾지 못해 느린 걸음과 같게 둔 가정)
turn_deg_s = 200           ; 도는 빠르기
accel_ticks = 2            ; 빠르기가 바뀌는 데 걸리는 시간(가정. 도는 동작 하나가 약 0.1초)
speed_scale = 0.22         ; 게임용 배율. 1이면 실제 비율 그대로이고 달아날 때 사람보다 6배 빠르다
turn_scale = 1.0           ; 게임용 배율(도는 빠르기)

; 도약. 뇌의 달아남 출력(거대 섬유 뉴런)이 takeoff_level 이상이면 하던 일을 끊고 뛰어오른다
takeoff_level = 0.5        ; 뛰는 기준. 미니게임에서 "발화했다"고 보는 기준과 같다
takeoff_mm_s = 480         ; 뛰어오른 직후의 빠르기(잰 값). 같은 게임용 배율을 곱한다
air_ticks = 4              ; 떠 있는 시간(게임 규칙. 0이면 뛰지 않는다)
air_rest_ticks = 20        ; 내려앉은 뒤 다시 뛰지 못하는 시간(게임 규칙)

swat_range = 1.2           ; 파리채: 몸끼리 닿은 뒤로 이만큼, 앞쪽 35도 안
swat_damage = 10
swat_cooldown = 8
spray_range = 5            ; 스프레이: 곧게 나가는 물줄기
spray_damage = 3
spray_ammo = 20
spray_cooldown = 8
trap_speed = 0.6           ; 끈끈이: 던지면 날아가다 초파리에 닿으면 붙는다
trap_range = 8
trap_count = 2
stun_ticks = 60            ; 붙어 있는 시간(3초). 그동안 움직이지도 공격하지도 못한다

charge_range = 5           ; 돌진: 이 거리 안의 보이는 참가자에게
charge_speed = 0.35
charge_windup = 12         ; 겨누는 시간(이때 피할 수 있다)
charge_ticks = 20
charge_cooldown = 80
wave_radius = 3            ; 날갯짓: 이 거리 안의 참가자를 모두 밀어낸다
wave_push = 2.5
wave_period = 200          ; 10초마다

loom_range = 5             ; 참가자가 다가오는 것을 느끼는 거리
wall_sense = 1.5           ; 앞의 벽을 느끼는 거리
near_range = 1.5           ; 이 거리 안의 참가자는 서 있기만 해도 자극이 된다
; 자극의 세기는 진짜 뇌에 맞췄다: 진짜 뇌는 자극 0.23쯤에서 뛰어오른다(make bossbot BRAIN=real의 첫 줄)
near_gain = 0.12           ; 바로 붙어 있을 때 더하는 자극
loom_base = 0.08           ; 다가옴 자극 = 가까움 x (loom_base + loom_gain x 다가오는 빠르기)
loom_gain = 0.55
wall_turn = 1.0            ; 벽이 바로 앞일 때 반대쪽으로 도는 세기. 뇌와 무관한 몸의 규칙(벽은 뇌에 넣지 않는다)
loom_speed = 0.15          ; 이 빠르기(칸/틱)로 다가오면 빠르기를 1로 본다. 보통 걸음이 0.17, 살금살금이 0.03이다
loom_avg_ticks = 10        ; 다가오는 빠르기를 평균하는 시간(0.5초)
hurt_ticks = 20            ; 맞은 뒤 1초는 때린 쪽에서 강한 자극이 들어오고, 돌진하지 않는다
rush_level = 0.15          ; 다가옴 자극이 이보다 세면 몰린 것으로 보고 돌진하지 않는다
