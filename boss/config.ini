; 보스전 수치. 없는 줄은 boss/boss.c의 기본값을 쓴다. 거리는 칸, 시간은 틱(1틱 = 50ms)
ticks = 3600               ; 판의 길이(180초)
fly_hp_1 = 40              ; 초파리 체력. 참가자 수마다 따로 정한다: 1명일 때
fly_hp_2 = 120             ;   2명일 때. 여럿이면 초파리를 에워싸서 한 사람 몫보다 훨씬 빨리 깎는다
fly_hp_3 = 180             ;   3명일 때
fly_radius = 0.6
player_radius = 0.25
step = 0.5                 ; 한 걸음(칸)
slow_step = 0.1            ; 살금살금 한 걸음(C로 켜 두었거나 Shift를 누른 채 이동)
step_ticks = 3             ; 한 걸음에 걸리는 틱 수. 이 틱 수에 나눠 움직이고, 키를 누르고 있어도 이보다 빨리 걷지 못한다

; 초파리의 몸. 실제 초파리에서 잰 값이다(출처는 docs/brain-notes.md). 뇌의 반응(0~1)에 곱한다
body_mm = 2.5              ; 몸길이. 게임에서는 지름(fly_radius x 2)이 몸길이다
walk_mm_s = 28             ; 앞으로 걷기. 걷기 명령 뉴런의 반응이 1일 때의 빠르기. 자유롭게 걷는 초파리에서 가장 흔한 값
run_mm_s = 44.7            ; 달아나기(가장 빠른 걸음)
back_mm_s = 7.2            ; 뒤로 걷기(잰 값을 찾지 못해 느린 걸음과 같게 둔 가정)
turn_deg_s = 200           ; 도는 빠르기
; 몸(boss/body.c): 뇌의 좌우 명령이 다리 여섯의 걸음을 조절하고, 딛는 다리가 몸을 민다
step_hz = 4.5              ; 걸음 빈도(초당 걸음 수). 실제는 12쯤이다. 화면에서 걸음이 보이게 낮췄다(보폭이 그만큼 길다)
cpg_couple = 10            ; 진동자 사이의 세기(Wang-Chen 외 2024)
cpg_converge = 20          ; 보폭이 명령을 따라가는 빠르기(같은 논문)
swing_front = 2.37         ; 발을 드는 동안이 끝나는 위상(라디안, 한 바퀴가 6.28). 앞다리. 같은 연구진이 잰 한 걸음에서
swing_mid = 2.23           ; 가운데 다리
swing_hind = 1.95          ; 뒷다리
foot_lift = 0.12           ; 발을 드는 높이(칸). 가정
foot_fore = 0.48           ; 앞다리와 뒷다리의 발이 놓이는 앞뒤 거리(칸). 그리는 모형에 맞춘 값
foot_side = 0.45           ; 발이 놓이는 옆 거리(칸). 그리는 모형에 맞춘 값
body_spring_hz = 8         ; 다리가 몸을 제자리로 붙드는 빠르기(Hz). 가정
body_damping = 0.7         ; 그 흔들림이 잦아드는 정도(1이면 흔들림 없이 돌아온다). 가정
leg_grip = 60              ; 다리 하나가 버티는 힘(질량 1에 대한 값). 넘으면 발이 미끄러진다. 가정
hit_push = 2.0             ; 파리채에 맞았을 때 밀려나는 빠르기(칸/초). 가정
speed_scale = 0.22         ; 게임용 배율. 1이면 실제 비율 그대로이고 달아날 때 사람보다 6배 빠르다
turn_scale = 1.0           ; 게임용 배율(도는 빠르기)

; 도약. 뇌의 달아남 출력(거대 섬유 뉴런)이 takeoff_level 이상이면 하던 일을 끊고 뛰어오른다
takeoff_level = 0.5        ; 뛰는 기준. 미니게임에서 "발화했다"고 보는 기준과 같다
takeoff_mm_s = 480         ; 뛰어오른 직후의 빠르기(잰 값). 같은 게임용 배율을 곱한다
takeoff_scale = 0.055      ; 도약에만 곱하는 게임용 배율. 전체 배율(0.22)을 쓰면 0.2초에 10칸을 날아가 순간이동처럼 보였다
air_ticks = 12             ; 떠 있는 가장 긴 시간(게임 규칙. 0이면 뛰지 않는다). 착지 명령이 없으면 이만큼 날고 내려앉는다(0.6초에 7칸쯤)
; 떠 있는 동안. 꺾는 쪽과 내려앉는 때는 뇌가 정한다(docs/brain-notes.md 8절)
air_turn_deg_s = 1000      ; 꺾기 명령 뉴런(DNp06)의 좌우 차이가 1일 때 도는 빠르기. 비행 중 급회전에서 잰 값(초당 1000도 이상)
air_turn_scale = 0.3       ; 게임용 배율. 실제 급회전은 0.05초에 90도를 돌고 끝난다. 여기서는 명령이 있는 동안 천천히 계속 돈다
land_level = 0.5           ; 착지 명령 뉴런(DNp07)의 반응이 이 이상이면 내려앉기 시작한다
surface_gain = 0.07        ; 날아가는 쪽 벽의 자극 = surface_gain x 빠르기 / 거리. 지금 값이면 벽이 4칸쯤 남았을 때 0.2다. 가정
surface_max = 0.5          ; 그 자극의 상한. 착지 뉴런은 여기서 이미 충분히 발화한다. 더 세게 주면 뇌 전체가 폭주할 수 있다
air_min_ticks = 4          ; 뛰어오른 뒤 이만큼은 내려앉지 않는다(게임 규칙)
air_land_ticks = 3         ; 바닥에 내려앉는 데 걸리는 시간(게임 규칙)
; 착지 명령이 켜지면 다리를 뻗고 속도를 줄여 그 벽으로 가서 붙는다. 시간 안에 못 닿으면 바닥에 내려앉는다
approach_speed = 0.6       ; 착지 명령 뒤의 빠르기 배율. 가정
approach_ticks = 14        ; 벽까지 가는 데 주는 시간(게임 규칙)
perch_rest_ticks = 14      ; 벽에 붙은 뒤 다시 뛰지 못하는 시간(0.7초). 벽에서는 걸어서 달아날 수 없어서 바닥(1초)보다 짧게 두었다(게임 규칙)
perch_min_ticks = 20       ; 벽에 붙은 뒤 이만큼(1초)은 머문다(게임 규칙)
perch_walk = 0.1           ; 그 뒤 뇌의 걷기 명령이 이 이상이면 바닥으로 내려온다. 그 전에 다가옴이 세면 벽에서 날아오른다
; 나는 자세. 화면에 보이는 것이고 맞고 안 맞고에는 쓰지 않는다. 각도는 가정이다(느릴수록 몸을 세우고, 꺾을 때 도는 쪽으로 기울인다)
air_height = 1.1           ; 날아가는 높이(칸)
perch_height = 0.45        ; 벽에 붙어 있는 높이(칸). 붙은 뒤 이 높이로 옮겨 앉는다
pitch_climb_deg = 40       ; 머리를 드는 각도: 솟을 때
pitch_cruise_deg = 10      ;   날아갈 때
pitch_flare_deg = 45       ;   내려앉으려고 속도를 줄일 때
bank_deg = 55              ; 꺾기 명령이 가장 셀 때 옆으로 기울이는 각도
air_rest_ticks = 20        ; 내려앉은 뒤 다시 뛰지 못하는 시간(게임 규칙)

swat_range = 1.2           ; 파리채: 몸끼리 닿은 뒤로 이만큼, 앞쪽 35도 안. 초파리가 달아나느라 솟아오른 동안은 닿지 않는다
swat_damage = 10
swat_cooldown = 8
spray_range = 5            ; 스프레이: 곧게 나가는 물줄기
spray_damage = 3
spray_ammo = 20
spray_cooldown = 8
trap_speed = 0.6           ; 끈끈이: 던지면 날아가다 초파리에 닿으면 붙는다
trap_range = 8
trap_count = 2
trap_loom = 1.0            ; 날아오는 끈끈이가 주는 다가옴 자극(바로 앞에 왔을 때). 0이면 초파리가 끈끈이를 보지 못한다
trap_see = 4               ; 끈끈이가 이 거리 안에 들어오면 자극이 시작된다. 멀리서 던지면 보고 뛰어오르고, 가까이서 던지면 못 피한다. 가정
stun_ticks = 60            ; 붙어 있는 시간(3초). 그동안 움직이지도 공격하지도 못한다
stun_struggle = 1          ; 몸부림: 붙어 있는 동안 뇌의 달아남 출력이 기준을 넘는 틱에는 이만큼 더 빨리 떨어진다(1이면 두 배). 0이면 끈다

guard_ticks = 10           ; 막기: 막는 자세의 길이(0.5초). 그동안 돌진에 닿으면 다치지 않는다
guard_cooldown = 50        ; 막기를 다시 쓸 때까지(2.5초)
guard_stun = 24            ; 막힌 초파리가 멈추는 시간(1.2초)

jump_ticks = 10            ; 뛰어오르기: 떠 있는 시간(0.5초). 빨리 솟아 꼭대기에서 느려지고, 올라갈 때보다 빨리 떨어진다
jump_height = 1.0          ; 꼭대기의 높이(칸)
jump_clear = 0.35          ; 돌진이 닿는 순간에 이 높이 이상이면 돌진이 발밑으로 지나간다(그 돌진에는 다시 맞지 않는다)
jump_rest = 0              ; 내려선 뒤 다시 뛰지 못하는 시간. 0이면 내려서자마자 다시 뛸 수 있다
jump_buffer = 3            ; 아직 떠 있을 때 누른 키를 기억해 두는 시간(0.15초). 그 안에 내려서면 바로 다시 뛴다
jump_carry = 4             ; 뛰기 전 이만큼(0.2초) 안에 걷고 있었으면 걷던 빠르기와 방향 그대로 날아간다

; 먹이(4번). 초파리는 냄새가 닿는 거리 안에 보이는 먹이로 걸어가고, 닿으면 단맛 자극이 뇌로 들어간다.
; 뇌의 먹기 반응(진짜 뇌에서는 주둥이를 내미는 운동 뉴런)이 feed_level 이상이면 그 자리에서 먹는다
bait_count = 3             ; 참가자마다 가진 먹이의 수
bait_throw = 3.0           ; 보는 쪽으로 이만큼 앞에 놓는다(칸)
bait_smell = 8.0           ; 먹이가 보이는 거리(칸). 벽에 가리면 보이지 않는다
see_bait = 1.0             ; 먹이가 물체로 보이는 세기. 초파리는 보이는 물체 쪽으로 걸어간다(뇌의 걷기 명령 뉴런)
see_player = 0.35          ; 참가자가 물체로 보이는 세기
see_range = 12             ; 참가자가 보이는 거리(칸). 벽에 가리면 보이지 않는다
pursue_turn = 1.0          ; 걷기 명령의 좌우 차이가 도는 빠르기에 주는 몫
bait_sugar = 1.0           ; 먹이에 닿았을 때 뇌에 주는 단맛 자극
feed_level = 0.5           ; 먹기 반응이 이 이상이면 먹는다
bait_ticks = 60            ; 다 먹는 데 걸리는 시간(3초). 그동안 살금살금 다가가면 때릴 수 있다
bait_heal = 5              ; 다 먹으면 돌아오는 체력
bait_wary = 100            ; 맞은 뒤 먹이를 찾지 않는 시간(5초). 먹이 쪽에 있다가 맞으면 그 먹이는 버린다

charge_range = 5           ; 돌진: 이 거리 안의 보이는 참가자에게
charge_speed = 0.35
charge_windup = 12         ; 겨누는 시간(이때 피할 수 있다)
charge_ticks = 20
charge_cooldown = 80
wave_radius = 3            ; 날갯짓: 이 거리 안의 참가자를 모두 밀어낸다
wave_push = 2.5
wave_period = 200          ; 10초마다

loom_range = 5             ; 참가자가 다가오는 것을 느끼는 거리
wall_sense = 1.5           ; 앞의 벽을 느끼는 거리
near_range = 1.5           ; 이 거리 안의 참가자는 서 있기만 해도 자극이 된다
; 자극의 세기는 진짜 뇌에 맞췄다: 진짜 뇌는 자극 0.23쯤에서 뛰어오른다(make bossbot BRAIN=real의 첫 줄)
near_gain = 0.12           ; 바로 붙어 있을 때 더하는 자극
loom_base = 0.08           ; 다가옴 자극 = 가까움 x (loom_base + loom_gain x 다가오는 빠르기)
loom_gain = 0.55
wall_turn = 1.0            ; 벽이 바로 앞일 때 반대쪽으로 도는 세기. 뇌와 무관한 몸의 규칙(벽은 뇌에 넣지 않는다)
loom_speed = 0.15          ; 이 빠르기(칸/틱)로 다가오면 빠르기를 1로 본다. 보통 걸음이 0.17, 살금살금이 0.03이다
loom_avg_ticks = 10        ; 다가오는 빠르기를 평균하는 시간(0.5초)
hurt_ticks = 20            ; 맞은 뒤 1초는 때린 쪽에서 강한 자극이 들어오고, 돌진하지 않는다

; 2페이즈: 초파리 추격(stages/run). 초파리의 체력이 처음의 phase2_hp배 이하가 되면 싸움을 멈추고 통로를 달린다.
; 한 명이라도 끝까지 물리지 않으면 참가자가 이긴다. 수치는 stages/run/config.ini에 있다
phase2_hp = 0.5            ; 0이면 2페이즈가 없다(1페이즈만으로 끝난다)
phase2_ticks = 600         ; 2페이즈의 길이(틱). 30초
rush_level = 0.15          ; 다가옴 자극이 이보다 세면 몰린 것으로 보고 돌진하지 않는다
