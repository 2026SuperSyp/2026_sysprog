; 보스전 수치. 없는 줄은 boss/boss.c의 기본값을 쓴다. 거리는 칸, 시간은 틱(1틱 = 50ms)
ticks = 3600               ; 판의 길이(180초)
fly_hp_per_player = 80     ; 초파리 체력 = 이것 x 참가자 수
fly_radius = 0.6
player_radius = 0.25
step = 0.5                 ; 키 한 번에 가는 거리
fly_speed = 0.08           ; 초파리가 한 틱에 가는 거리(앞으로 갈 때 0.6배, 달아날 때 escape_gain배)
escape_gain = 3.0          ; 달아날 때 빠르기의 배수. 크면 위협을 받을 때 확 튄다
fly_turn = 0.33            ; 초파리가 한 틱에 도는 각도(라디안)

swat_range = 1.2           ; 파리채: 몸끼리 닿은 뒤로 이만큼, 앞쪽 35도 안
swat_damage = 10
swat_cooldown = 8
spray_range = 5            ; 스프레이: 곧게 나가는 물줄기
spray_damage = 3
spray_ammo = 20
spray_cooldown = 8
trap_speed = 0.6           ; 끈끈이: 던지면 날아가다 초파리에 닿으면 붙는다
trap_range = 8
trap_count = 2
stun_ticks = 60            ; 붙어 있는 시간(3초). 그동안 움직이지도 공격하지도 못한다

charge_range = 5           ; 돌진: 이 거리 안의 보이는 참가자에게
charge_speed = 0.35
charge_windup = 12         ; 겨누는 시간(이때 피할 수 있다)
charge_ticks = 20
charge_cooldown = 80
wave_radius = 3            ; 날갯짓: 이 거리 안의 참가자를 모두 밀어낸다
wave_push = 2.5
wave_period = 200          ; 10초마다

loom_range = 5             ; 참가자가 다가오는 것을 느끼는 거리
wall_sense = 1.5           ; 앞의 벽을 느끼는 거리
near_range = 1.5           ; 이 거리 안의 참가자는 서 있기만 해도 자극이 된다
near_gain = 0.6            ; 바로 붙어 있을 때 더하는 자극
hurt_ticks = 20            ; 맞은 뒤 1초는 때린 쪽에서 강한 자극이 들어오고, 돌진하지 않는다
rush_level = 0.4           ; 다가옴 자극이 이보다 세면 몰린 것으로 보고 돌진하지 않는다
