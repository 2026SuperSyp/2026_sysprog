; 예제 스테이지의 난이도 숫자. 코드에 숫자를 쓰지 않고 여기에 둔다.
rock_speed_min     = 4.0    ; 돌이 한 틱에 떨어지는 픽셀 수. 돌마다 이 사이에서 무작위로 정한다(씨앗에서)
rock_speed_max     = 7.5
rock_start_max     = 30     ; 돌이 나타나는 높이의 한도(픽셀). 0과 이 값 사이에서 무작위. 낮게 나타나면 더 빨리 닿는다
rock_ramp          = 0.4    ; 뒤의 돌일수록 빠르고 낮게 나타난다. 0.4면 마지막에는 빠르기와 높이가 1.4배
ramp_rocks         = 30     ; 이 번째 돌까지 점점 어려워지고 그 뒤로는 같다. 한 판에 돌은 30개 남짓 떨어진다
step               = 8      ; 한 걸음의 픽셀 수
move_gap_ticks     = 2      ; 걸음 사이의 최소 틱 수(키와 마우스 모두)
loom_gain          = 1.3    ; 돌이 가까운 정도를 자극 세기로 바꾸는 계수
fly_hop            = 16     ; 초파리가 한 번에 뛰는 픽셀 수
hop_cooldown_ticks = 8      ; 초파리가 한 번 뛴 뒤 다시 뛸 수 있을 때까지의 틱 수
score_per_dodge    = 2      ; 돌 하나를 피했을 때의 점수
near_margin        = 6      ; 피했지만 맞는 거리에서 이 픽셀도 더 떨어져 있지 않았으면 아슬하게 피한 것이다
near_bonus         = 2      ; 아슬하게 피했을 때 더 주는 점수. 잘하면 한 판에 100점 근처
wall_gain          = 0.8    ; 벽이 가까운 정도를 자극 세기로 바꾸는 계수
wall_range         = 20     ; 벽이 이 픽셀 안에 있으면 다가오는 것으로 친다
