; 파리채 피하기의 난이도 숫자. 코드에 숫자를 쓰지 않고 여기에 둔다.
; 한 틱은 0.05초라서 20틱이 1초이다.
warn_ticks         = 6      ; 예고(그림자가 깜빡이는) 틱 수
approach_ticks     = 10     ; 판 처음에 파리채가 내려오는 틱 수
approach_end_ticks = 6      ; 판이 흐를수록 내려오는 틱 수가 이 값 쪽으로 준다(정수 나눗셈이라 실제로는 7까지). 예고 + 이 값이 12 아래가 되면 사람이 못 피한다
slam_ticks         = 4      ; 내려친 채로 머무는 틱 수. 이 동안의 첫 틱에 맞았는지 정한다
lift_ticks         = 3      ; 파리채가 올라가는 틱 수
first_delay_ticks  = 20     ; 첫 파리채가 나오기까지의 틱 수
rest_min_ticks     = 6      ; 파리채 사이의 쉬는 틱 수(가장 짧은 값)
rest_max_ticks     = 12     ; 같은 값(가장 긴 값)
head_w             = 28     ; 파리채 머리의 폭(픽셀)
body_w             = 14     ; 캐릭터의 폭(픽셀). 맞는 폭이기도 하다
step               = 8      ; 유저의 한 걸음(픽셀)
move_gap_ticks     = 2      ; 걸음 사이의 최소 틱 수
stun_ticks         = 6      ; 맞은 뒤 움직이지 못하는 틱 수
lives              = 3      ; 생명 수(1~9). 맞을 때마다 하나 줄고 0이 되면 그 쪽은 탈락해서 멈춘다
hit_penalty        = 6      ; 맞았을 때의 감점(0 아래로는 내려가지 않는다)
score_per_dodge    = 6.5    ; 파리채 하나를 피했을 때의 점수
near_px            = 8      ; 맞는 폭 바로 바깥 이 픽셀 안에서 피하면 아슬하게 피한 것이다(한 걸음과 같게 둔다)
near_bonus         = 2      ; 아슬하게 피했을 때 더 주는 점수
pop_ticks          = 10     ; 파리채가 닿은 뒤 결과 글자(+6.5, 아슬!, -6)를 띄워 두는 틱 수
mark_ticks         = 6      ; 초파리가 뛴 뒤 머리 위에 "!"를 띄워 두는 틱 수
loom_gain          = 1.3    ; 파리채가 가까운 정도를 자극 세기로 바꾸는 계수
warn_level         = 0.5    ; 예고 때의 자극 세기(접근이 끝날 때 1.0까지 커진다)
sense_margin       = 4      ; 파리채 가장자리에서 이만큼 떨어진 곳부터 초파리가 느낀다
fly_hop            = 12     ; 초파리가 한 번에 뛰는 픽셀 수. 맞는 폭의 절반(21)보다 작아서 한 번 뛰어서는 다 벗어나지 못한다
hop_cooldown_ticks = 16     ; 초파리가 한 번 뛴 뒤 다시 뛸 수 있을 때까지의 틱 수
wall_gain          = 0.5    ; 벽이 가까운 정도를 자극 세기로 바꾸는 계수
wall_range         = 14     ; 벽이 이 픽셀 안에 있으면 다가오는 것으로 친다
