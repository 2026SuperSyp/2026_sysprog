
; Fixed obstacle-field spider web escape
; W/A/S/D movement, camera follows upward climbing

body_w         = 10
step           = 7
move_gap_ticks = 1

fly_speed      = 1.8    ; px per tick at walk reaction 1; the fly climbs only while the way up is open (goal around tick 235-270)

lives          = 3
stun_ticks     = 6
grace_ticks    = 14     ; after the stun, webs only block (no life lost) for this many ticks

finish_base    = 75     ; score for reaching the goal on the last tick
time_bonus     = 30     ; extra score for reaching the goal at tick 0 (scaled by the ticks left)
climb_max      = 70     ; score for 100% climb without reaching the goal (kept below finish_base)
hit_penalty    = 5      ; score lost for every life lost on a web

sense_range    = 48
level_min      = 0.3
level_max      = 0.6
steer_px       = 3.4    ; fly side step; the fly does not climb while it steps sideways
turn_deadzone  = 0.05
see_level      = 1.0    ; object level (right side) for the open way up; the walk reaction sets the climbing speed
map_variant = -1