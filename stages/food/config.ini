; 음식 골라 먹기 난이도 숫자. 코드에 숫자를 쓰지 않고 여기에 둔다.
fall_speed          = 1.6    ; 음식이 한 틱에 떨어지는 픽셀 수
gap_start_ticks     = 30     ; 처음 음식 사이 간격(틱)
gap_end_ticks       = 22     ; 마지막 음식 사이 간격(틱)
first_food_ticks    = 10     ; 첫 음식이 나오는 틱
eat_zone            = 10     ; 음식의 아래쪽이 머리 위 이 픽셀 안에 오면 닿은 것으로 친다
touch_w             = 10     ; 몸 가운데에서 가로로 이 픽셀 안이면 닿은 것으로 친다
score_good          = 8      ; 좋은 음식을 먹었을 때(3연속부터는 절반을 더 준다)
score_bad           = 10     ; 나쁜 음식을 먹었을 때 깎는 점수
score_skip_bad      = 4      ; 내 머리 쪽으로 오던 나쁜 음식을 먹지 않고 보냈을 때(다른 줄로 떨어진 것은 주지 않는다)
dodge_near_px       = 16     ; 나쁜 음식이 내 줄에서 닿기 이 픽셀 앞까지 오면 '내 쪽으로 왔다'로 친다. 클수록 일찍 피해도 점수를 받는다
yuck_ticks          = 16     ; 나쁜 것을 먹은 뒤 못 움직이고 못 먹는 틱 수(웩)
fly_spit_ticks      = 20     ; 초파리가 맛보고 뱉은 뒤 못 움직이는 틱 수(퉤). 클수록 초파리가 약하다
hearts              = 3      ; 스테이지 안의 생명. 다 잃으면 그 자리에서 멈춘다
crumble_layers      = 2      ; 나쁜 음식을 먹었을 때 무너지는 탑의 층 수
tower_max_layers    = 4      ; 화면에 보이는 탑의 최대 층 수(넘어도 층 수는 계속 센다). 탑만큼 머리가 올라가 음식에 빨리 닿는다. 4층이면 음식이 나온 뒤 피할 틈이 8틱쯤 남는다
run_speed           = 5      ; 줄을 옮길 때 한 틱에 달리는 픽셀 수
move_gap_ticks      = 3      ; 줄을 옮기는 사이의 최소 틱 수(초파리도 같다)
fly_notice_y        = 40     ; 초파리는 음식이 이 높이(픽셀)보다 내려와야 그 줄로 간다. 클수록 초파리가 늦다
bad_ratio           = 0.45   ; 나쁜 음식이 나올 확률
trap_ratio          = 0.35   ; 나쁜 음식 가운데 단짠(단맛이 센 짠 음식)이 나올 확률
max_traps           = 2      ; 한 판에 나오는 단짠의 최대 개수. 하트보다 적게 둬야 진짜 뇌 초파리가 단짠만으로 탈락하지 않는다
feed_threshold      = 0.5    ; 초파리의 먹기 반응이 이 값 이상이면 먹는다
fly_loom_px         = 24     ; 물건이 머리 위 이 픽셀 안으로 오면 초파리 뇌에 '다가옴'(looming) 자극을 준다. 작을수록 늦게 알아채 더 자주 맞는다
escape_threshold    = 0.5    ; 초파리의 도망 반응이 이 값 이상이면 옆 줄로 피한다
