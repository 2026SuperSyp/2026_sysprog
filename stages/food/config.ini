; 음식 골라 먹기의 난이도 숫자. 코드에 숫자를 쓰지 않고 여기에 둔다. 시간은 틱(1틱 = 0.05초)
food_ticks      = 30     ; 음식 하나가 놓여 있는 시간
gap_ticks       = 10     ; 다음 음식이 나오기까지 비는 시간
sweet_percent   = 50     ; 단것이 나오는 비율(%). 나머지는 쓴것, 물, 섞인것 가운데 하나
score_good      = 20     ; 단것을 먹었을 때 얻는 점수. 한 판에 음식이 10개, 그중 단것이 5개쯤이라 다 먹으면 100점
penalty_bad     = 10     ; 먹으면 안 되는 것을 먹었을 때 잃는 점수(0 아래로는 내려가지 않는다)
fly_wait_ticks  = 5      ; 초파리는 음식이 놓이고 이만큼 지난 뒤부터 먹는다(앞 음식의 반응이 남아 있을 수 있다)

; 음식마다 뇌에 주는 자극의 세기(0~1). 진짜 뇌에서의 반응은 make brain-table BRAIN=real 로 본다
sweet_sugar     = 1.0    ; 단것: 단맛
bitter_bitter   = 1.0    ; 쓴것: 쓴맛
water_water     = 1.0    ; 물
mixed_sugar     = 1.0    ; 섞인것: 단맛과
mixed_bitter    = 0.8    ;         쓴맛. 0.7보다 낮추면 가짜 뇌가, 0.5보다 낮추면 진짜 뇌도 먹기 시작한다
