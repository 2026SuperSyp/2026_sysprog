; 보트 탈출의 난이도 숫자. 코드에 숫자를 쓰지 않고 여기에 둔다.
; 한 틱은 0.05초라서 20틱이 1초이다. 길이는 픽셀이다.
coop               = 1      ; 협동 스테이지 표시. tools/bot.sh가 보고 '혼자 돌린 판과 같은 점수' 검사를 건너뛴다
stroke_power       = 0.45   ; 노를 한 번 저을 때 보트가 얻는 빠르기(한 틱에 가는 픽셀 수)
stroke_turn        = 0.25   ; 노를 한 번 저을 때 보트가 꺾이는 각도(라디안). 왼쪽 노는 오른쪽으로 꺾는다
drag_keep          = 0.942  ; 한 틱이 지나면 빠르기에 곱하는 값. 작을수록 빨리 멈춘다
cooldown_ticks     = 6      ; 앞의 노질에서 이 틱 수가 지나기 전에 저으면 엇박(헛저음)
early_keep         = 0.8    ; 엇박일 때 빠르기에 곱하는 값
wrong_keep         = 0.9    ; 차례가 아닌데 젓거나 반대쪽 키를 눌렀을 때 빠르기에 곱하는 값
wrong_gap_ticks    = 4      ; 같은 사람의 위 감속 사이의 최소 틱 수
turn_limit_ticks   = 24     ; 차례의 제한 틱 수. 지나면 다음 사람에게 넘어간다
start_gap          = 34     ; 시작할 때 초파리와 보트의 거리
contact_dist       = 7      ; 이 거리 안이면 초파리가 보트에 닿은 것이다. 닿아 있는 동안 단맛 자극이 들어간다
sugar_level        = 1.0    ; 닿았을 때의 단맛 자극 세기
feed_level         = 0.5    ; 뇌의 먹기 반응이 이 이상이면 물린 것이다
bitter_count       = 2      ; 팀이 가진 쓴 열매 수
bitter_ticks       = 60     ; 쓴 열매 하나가 듣는 틱 수
bitter_level       = 0.8    ; 쓴 열매가 듣는 동안 닿았을 때 같이 주는 쓴맛 자극 세기
spit_ticks         = 6      ; 쓴맛일 때 닿은 뒤 이 틱 수가 지나도록 물지 않았으면 뱉고 물러난다
bitter_push        = 22     ; 뱉고 물러나는 거리
splash_ticks       = 5      ; 물을 한 번 튀겼을 때 다가옴 자극을 주는 틱 수
splash_cooldown_ticks = 30  ; 물을 튀긴 뒤 다시 튀길 수 있을 때까지의 틱 수
splash_range       = 34     ; 튄 물이 닿는 거리. 가까울수록 자극이 세다
splash_level       = 1.0    ; 코앞에서 튀겼을 때의 다가옴 자극 세기(가장 먼 곳에서는 절반)
escape_push        = 16     ; 놀란 초파리가 뒤로 튀는 거리
escape_turn        = 0.6    ; 놀란 초파리가 꺾이는 각도(라디안)
hop_cooldown_ticks = 12     ; 초파리가 한 번 튄 뒤 다시 튈 수 있을 때까지의 틱 수
gap_far            = 70     ; 초파리 점수의 기준 거리. 끝났을 때 이보다 멀면 초파리 점수는 0
fly_speed          = 0.78   ; 걷기 반응이 1일 때 초파리가 한 틱에 가는 픽셀 수
fly_turn           = 0.05   ; 방향 반응이 1일 때 초파리가 한 틱에 도는 각도(라디안)
pursue_turn        = 0.5    ; 걷기 반응의 좌우 차이를 도는 데 보태는 비율
see_level          = 1.0    ; 보트(먹이)가 보일 때의 물체 자극 세기
center_band        = 0.15   ; 보트가 정면에서 이 각도(라디안) 안이면 자극을 주던 쪽에 계속 준다
rock_first         = 70     ; 첫 바위까지의 거리
rock_every         = 75     ; 바위 사이의 거리
rock_radius        = 5      ; 바위의 반지름
rock_keep          = 0.6    ; 바위에 부딪혔을 때 빠르기에 곱하는 값(바위 하나에 한 번)
bank_keep          = 0.7    ; 강둑에 닿아 있는 틱마다 빠르기에 곱하는 값
