; 초파리 추격(보스전 2페이즈)의 난이도 숫자. 코드에 숫자를 쓰지 않고 여기에 둔다.
; 한 틱은 0.05초라서 20틱이 1초이다. 길이의 단위는 차선 하나의 폭이다.
coop               = 1      ; 초파리 한 마리가 모두를 쫓는다. tools/bot.sh가 보고 '혼자 돌린 판과 같은 점수' 검사를 건너뛴다
run_speed          = 0.5    ; 참가자가 한 틱에 달리는 거리
lane_ticks         = 3      ; 차선 하나를 옮기는 데 걸리는 틱 수
jump_ticks         = 10     ; 뛰어올라 떠 있는 틱 수
jump_height        = 0.9    ; 뛰어오른 꼭대기의 높이
slide_ticks        = 10     ; 미끄러지는 틱 수
stumble_ticks      = 12     ; 장애물에 부딪힌 뒤 느려지는 틱 수
stumble_keep       = 0.4    ; 그동안 빠르기에 곱하는 값
goo_ticks          = 12     ; 끈끈이를 밟은 뒤 느려지는 틱 수
goo_keep           = 0.6    ; 그동안 빠르기에 곱하는 값
first_obstacle     = 14     ; 첫 장애물까지의 거리
gap_min            = 8      ; 장애물 사이의 거리(가장 짧은 값)
gap_max            = 13     ; 같은 값(가장 긴 값)
start_gap          = 9      ; 시작할 때 초파리와 참가자의 거리
gap_far            = 20     ; 거리 막대의 끝. 이보다 멀면 막대가 비어 있다
fly_speed          = 0.54   ; 걷기 반응이 1일 때 초파리가 한 틱에 가는 거리(물체 자극이 see_level이면 걷기 반응도 그쯤이다)
fly_strafe         = 0.07   ; 방향 반응이 1일 때 초파리가 한 틱에 옆으로 가는 거리
pursue_turn        = 0.5    ; 걷기 반응의 좌우 차이를 방향에 보태는 비율
see_level          = 0.9    ; 쫓는 참가자가 보일 때의 물체 자극 세기
side_hold_ticks    = 12     ; 물체 자극을 주는 쪽을 바꾼 뒤 다시 바꾸지 않는 틱 수
center_band        = 0.2    ; 참가자가 초파리의 정면에서 이 거리 안이면 자극을 주던 쪽에 계속 준다
contact_z          = 0.9    ; 앞뒤로 이 거리 안이고
contact_x          = 0.6    ; 옆으로 이 거리 안이면 초파리가 참가자에게 닿은 것이다. 닿아 있는 동안 단맛 자극이 들어간다
sugar_level        = 1.0    ; 닿았을 때의 단맛 자극 세기
feed_level         = 0.5    ; 뇌의 먹기 반응이 이 이상이면 물린 것이다(그 참가자는 탈락)
eat_ticks          = 24     ; 한 명을 문 뒤 초파리가 먹느라 멈춰 있는 틱 수
hint_dist          = 8      ; 내 차선의 장애물이 이 거리 안으로 오면 무엇을 할지(점프, 숙여, 왼쪽으로...) 화면에 적는다. 0이면 적지 않는다
