; 플래핑 플라이 난이도 숫자. 코드에 숫자를 쓰지 않고 여기에 둔다.
scroll_speed        = 1.3    ; 기둥이 한 틱에 다가오는 픽셀 수
pipe_every_ticks    = 34     ; 기둥이 나오는 간격(틱)
first_pipe_ticks    = 20     ; 첫 기둥이 나오는 틱
gap_start           = 46     ; 첫 기둥 틈의 높이(픽셀)
gap_end             = 26     ; 점수가 나는 마지막 기둥 틈의 높이(픽셀). 그 사이는 기둥마다 고르게 좁아진다
jump_start          = 250    ; 첫 기둥에서 틈이 이전 틈보다 오르내릴 수 있는 폭(틈이 움직이는 범위의 1/1000)
jump_end            = 450    ; 점수가 나는 마지막 기둥에서 그 폭
gravity             = 0.22   ; 한 틱에 아래로 빨라지는 정도
flap_speed          = 2.5    ; 날갯짓 한 번에 위로 오르는 빠르기
max_fall            = 3.2    ; 가장 빨리 떨어지는 빠르기
flap_gap_ticks      = 2      ; 날갯짓 사이의 최소 틱 수(연타 막기)
respawn_ticks       = 16     ; 부딪힌 뒤 다시 날 때까지의 틱 수
invul_ticks         = 24     ; 다시 난 뒤 부딪혀도 괜찮은 틱 수(이 동안 통과는 점수 없음)
score_per_pipe      = 7      ; 기둥 하나를 통과했을 때의 기본 점수
combo_step          = 1      ; 부딪히지 않고 이어서 통과할 때마다 기본 점수에 더 붙는 점수
combo_max           = 4      ; 더 붙는 것이 늘어나는 최대 횟수. 기둥 10개를 다 통과하면 7+8+9+10+11*6 = 100
crash_penalty       = 5      ; 부딪혔을 때 깎는 점수(이어서 통과한 수도 0이 된다)

; 초파리. 아래(바닥, 아래 기둥)에서 다가오는 것은 왼쪽 다가옴, 위(천장, 위 기둥)는 오른쪽 다가옴으로 준다.
look_ahead          = 30     ; 기둥이 이 픽셀 안에 오면 다가오는 것으로 친다
danger_range        = 16     ; 기둥 가장자리나 바닥이 이 픽셀 안이면 자극을 준다
loom_gain           = 1.0    ; 가까운 정도를 자극 세기로 바꾸는 계수
fly_flap_cooldown   = 8      ; 초파리가 한 번 날갯짓한 뒤 다시 할 수 있을 때까지의 틱 수(진짜 뇌는 방향 반응이 2~3틱 늦어서, 짧으면 오르는 중에 또 날갯짓해 좁은 틈의 위에 부딪힌다)
turn_margin         = 0.1    ; 방향 반응의 차이가 이보다 작으면 이번 틱에는 정하지 않는다
