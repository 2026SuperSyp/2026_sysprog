; 플래핑 플라이의 난이도 숫자. 코드에 숫자를 쓰지 않고 여기에 둔다. 거리는 픽셀, 시간은 틱(1틱 = 0.05초)
gravity                 = 0.35   ; 한 틱마다 아래로 더해지는 빠르기
flap_v                  = 3.2    ; 날갯짓 한 번에 위로 얻는 빠르기
flap_gap_ticks          = 2      ; 유저의 날갯짓 사이의 최소 틱 수
pillar_speed            = 2.0    ; 기둥이 한 틱에 다가오는 거리
pillar_spacing          = 60     ; 기둥과 기둥 사이의 거리. 한 판(400틱)에 기둥이 13개쯤 지나간다
first_pillar_x          = 120    ; 첫 기둥이 나타나는 자리(칸의 오른쪽 끝이 94)
gap_half                = 20     ; 틈의 절반 높이
score_per_pillar        = 8      ; 기둥 하나를 지나갔을 때의 점수. 13개를 다 지나면 104점

; 초파리의 조종. 가야 할 높이보다 loom_range만큼 아래에 있으면 자극이 loom_gain이 된다
loom_gain               = 1.0
loom_range              = 24
fly_flap_cooldown_ticks = 5      ; 초파리가 한 번 날갯짓한 뒤 다시 할 수 있을 때까지의 틱 수
